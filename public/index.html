<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malecon</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <header class="p-3 bg-stone-200 shadow-lg shadow-zinc-200">
      <h1 class="font-bold text-2xl">Grupo Malecon</h1>
    </header>

    <main class="mt-2 bg-gray-100 px-5 py-3 space-x-3 space-y-2 h-screen">
      <section id="buttons" class="grid grid-cols-1 md:grid-cols-3 space-y-2">
        <div class="grid grid-cols-4 space-x-3">
          <div class="col-span-3">
            <input
              id="buscar-nombre"
              type="text"
              placeholder="Buscar por nombre"
              class="border border-stone-300 rounded-lg p-2 w-full"
            />
          </div>

          <div class="col-span-1">
            <button
              id="btn-buscar"
              class="bg-indigo-300 rounded-lg py-2 px-3 hover:bg-indigo-600 hover:text-stone-100 cursor-pointer"
            >
              Buscar
            </button>
          </div>
        </div>

        <div></div>

        <div class="flex justify-end">
          <button
            id="crear"
            class="bg-emerald-300 rounded-lg py-2 px-4 hover:bg-emerald-600 hover:text-stone-100 cursor-pointer md:w-64 w-full"
          >
            Crear nuevo
          </button>
        </div>
      </section>

      <section
        id="data"
        class="grid grid-cols-1 md:grid-cols-3 space-x-3 space-y-2"
      ></section>
    </main>

    <!-- POPUP -->
    <section
      id="modal"
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center"
    >
      <div class="bg-white p-5 rounded-xl w-[90%] md:w-[500px]">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Nuevo registro</h2>

          <button
            id="cerrar"
            class="text-red-500 text-xl font-bold cursor-pointer"
          >
            X
          </button>
        </div>

        <form id="formulario" class="space-y-3">
          <input
            type="text"
            name="id"
            placeholder="ID"
            class="border p-2 rounded-lg w-full"
          />

          <input
            type="text"
            name="name"
            placeholder="Nombre"
            class="border p-2 rounded-lg w-full"
          />

          <input
            type="text"
            name="lastname"
            placeholder="Apellido"
            class="border p-2 rounded-lg w-full"
          />

          <input
            type="date"
            name="birthDate"
            class="border p-2 rounded-lg w-full"
          />

          <input
            type="text"
            name="photo"
            placeholder="URL de la foto"
            class="border p-2 rounded-lg w-full"
          />

          <textarea
            name="description"
            placeholder="Descripción"
            class="border p-2 rounded-lg w-full"
          ></textarea>

          <input
            type="text"
            name="color"
            class="border p-2 rounded-lg w-full h-12"
          />

          <button
            type="submit"
            class="bg-emerald-500 text-white rounded-lg py-2 px-4 w-full hover:bg-emerald-700 guardar"
          >
            Guardar
          </button>
          <button
            type="submit"
            class="bg-emerald-500 text-white rounded-lg py-2 px-4 w-full hover:bg-emerald-700 hidden actualizar"
          >
            Actualizar
          </button>
        </form>
      </div>
    </section>
    <script src="main.js"></script>
  </body>
</html>
